    <script>
      // Re-apply the saved theme before React loads, so there is no flash.
      (function () {
        var KEY = 'sao-y-lenh';
        try {
          var mode = localStorage.getItem(KEY + '-mode') || 'dark';
          if (mode === 'dark') document.documentElement.classList.add('dark');
          var vars = JSON.parse(localStorage.getItem(KEY + '-vars') || 'null');
          if (vars) for (var k in vars) document.documentElement.style.setProperty(k, vars[k]);
        } catch (e) {}
      })();
    </script>
